name: Release

# Builds portable "full bundle" packages (self-contained UI + flowarden core)
# and attaches them to a GitHub Release when a 0.1.x version tag is pushed.
#
# Version naming (display):  Flowarden 0.1.0, Flowarden 0.1.1, …
# Git tag (preferred):       0.1.0, 0.1.1, …   (also accepts legacy v0.1.x)
#
# Trigger:
#   git tag -a 0.1.0 -m "Flowarden 0.1.0" && git push origin 0.1.0
#
# Users download from:
#   https://github.com/jdtec-ex/flowarden-ex/releases

on:
  push:
    tags:
      - "0.1.*"
      - "v0.1.*"
  # Manual: builds packages as workflow artifacts only (no GitHub Release).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: flowarden-linux-x64
            rid: linux-x64
            core_bin: flowarden
            archive: tar.gz
          - os: windows-latest
            artifact_name: flowarden-windows-x64
            rid: win-x64
            core_bin: flowarden.exe
            archive: zip
          - os: macos-latest
            artifact_name: flowarden-macos-arm64
            rid: osx-arm64
            core_bin: flowarden
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev pkg-config

      - name: Install Npcap SDK (Windows link)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tmp = $env:RUNNER_TEMP
          $sdkZip = Join-Path $tmp "npcap-sdk.zip"
          $sdkRoot = Join-Path $tmp "npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.15.zip" -OutFile $sdkZip
          if (Test-Path $sdkRoot) { Remove-Item -Recurse -Force $sdkRoot }
          Expand-Archive -Path $sdkZip -DestinationPath $sdkRoot -Force
          $libX64 = Get-ChildItem -Path $sdkRoot -Recurse -Directory -Filter "x64" |
            Where-Object { $_.FullName -match '[\\/]Lib[\\/]x64$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $libX64) { $libX64 = Join-Path $sdkRoot "Lib\x64" }
          if (-not (Test-Path (Join-Path $libX64 "wpcap.lib"))) {
            throw "wpcap.lib not found under $sdkRoot"
          }
          "LIBPCAP_LIBDIR=$libX64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBPCAP_VER=1.10.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $libEnv = if ($env:LIB) { "$libX64;$env:LIB" } else { $libX64 }
          "LIB=$libEnv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: flowarden -> target
          shared-key: release-${{ matrix.rid }}

      - name: Build flowarden core (release)
        working-directory: flowarden
        run: cargo build -p flowarden --release

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Avalonia UI (self-contained)
        working-directory: flowarden-ui
        run: >
          dotnet publish src/Flowarden.Ui/Flowarden.Ui.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o "${{ github.workspace }}/dist/${{ matrix.artifact_name }}"

      - name: Assemble portable bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="${{ github.workspace }}/dist/${{ matrix.artifact_name }}"
          CORE_SRC="${{ github.workspace }}/flowarden/target/release/${{ matrix.core_bin }}"
          if [[ ! -f "$CORE_SRC" ]]; then
            echo "Missing core binary: $CORE_SRC"
            ls -la "${{ github.workspace }}/flowarden/target/release" || true
            exit 1
          fi
          cp "$CORE_SRC" "$BUNDLE/${{ matrix.core_bin }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$BUNDLE/${{ matrix.core_bin }}"
            # Avalonia host binary name follows the project file.
            if [[ -f "$BUNDLE/Flowarden.Ui" ]]; then
              chmod +x "$BUNDLE/Flowarden.Ui"
            fi
          fi
          cp "${{ github.workspace }}/packaging/PORTABLE_README.txt" "$BUNDLE/README.txt"
          # Version stamp
          {
            echo ""
            echo "Build ref: ${{ github.sha }}"
            echo "Tag/ref:   ${{ github.ref_name }}"
            echo "RID:       ${{ matrix.rid }}"
          } >> "$BUNDLE/README.txt"
          # Do not pipe ls to head under pipefail (SIGPIPE → exit 2 on Linux).
          echo "Bundle contents (sample):"
          ls -la "$BUNDLE" | sed -n '1,40p' || true
          test -f "$BUNDLE/${{ matrix.core_bin }}"
          test -f "$BUNDLE/Flowarden.Ui" -o -f "$BUNDLE/Flowarden.Ui.exe"

      - name: Pack archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/dist"
          tar -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"
          ls -lh "${{ matrix.artifact_name }}.tar.gz"

      - name: Pack archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $name = "${{ matrix.artifact_name }}"
          Compress-Archive -Path (Join-Path $dist $name) -DestinationPath (Join-Path $dist "$name.zip") -Force
          Get-Item (Join-Path $dist "$name.zip") | Format-List Name, Length

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only 0.1.x / v0.1.x tag pushes create a public Release.
    if: >
      startsWith(github.ref, 'refs/tags/0.1.') ||
      startsWith(github.ref, 'refs/tags/v0.1.')
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -exec cp -v {} upload/ \;
          ls -lh upload
          test "$(find upload -type f | wc -l)" -ge 1

      - name: Resolve release title
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Tag 0.1.0 or v0.1.0 → display "Flowarden 0.1.0"
          REF="${{ github.ref_name }}"
          VER="${REF#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "title=Flowarden $VER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.title }}
          # Preliminary public blurb; keep short until longer notes are needed.
          body: |
            First Public Release of Flowarden.
          generate_release_notes: false
          files: upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
