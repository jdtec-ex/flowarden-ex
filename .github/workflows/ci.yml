name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core & CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowarden
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: flowarden -> target

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  ui:
    name: Avalonia UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowarden-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins a host-specific patch; CI accepts any 8.0.x.
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Flowarden.Ui.sln

      - name: Build
        run: dotnet build Flowarden.Ui.sln -c Release --no-restore

      # Headless UI tests are limited; keep compile gate strict for now.
      - name: Verify output
        run: test -f src/Flowarden.Ui/bin/Release/net8.0/Flowarden.Ui.dll
