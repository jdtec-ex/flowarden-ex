syntax = "proto3";

package flowarden.control.v1;

service ControlService {
  rpc StartCapture(StartCaptureRequest) returns (ControlResponse);
  rpc StopCapture(StopCaptureRequest) returns (ControlResponse);
  rpc PauseCapture(PauseCaptureRequest) returns (ControlResponse);
  rpc ResumeCapture(ResumeCaptureRequest) returns (ControlResponse);
  rpc SetSource(SetSourceRequest) returns (ControlResponse);
  rpc ApplyFilter(ApplyFilterRequest) returns (ControlResponse);
  rpc SetSignalPolicy(SetSignalPolicyRequest) returns (ControlResponse);
  rpc GetSyslogConfig(GetSyslogConfigRequest) returns (SyslogConfigResponse);
  rpc SetSyslogConfig(SetSyslogConfigRequest) returns (ControlResponse);
  rpc ShutdownCore(ShutdownCoreRequest) returns (ControlResponse);
}

message StartCaptureRequest {}

message StopCaptureRequest {}

message PauseCaptureRequest {}

message ResumeCaptureRequest {}

enum CaptureSourceMode {
  CAPTURE_SOURCE_MODE_UNSPECIFIED = 0;
  CAPTURE_SOURCE_MODE_LIVE = 1;
  CAPTURE_SOURCE_MODE_OFFLINE = 2;
}

message CaptureSourceSpec {
  CaptureSourceMode mode = 1;
  string device_name = 2;
  string file_path = 3;
}

message SetSourceRequest {
  CaptureSourceSpec source = 1;
}

message ApplyFilterRequest {
  string bpf = 1;
}

// Watchlist / threshold policy for BehaviorSignal detectors in resident core.
// Patterns may be plain hosts/IPs, or prefixed: service:https, process:Chrome, sni:example.com
message SetSignalPolicyRequest {
  uint64 data_threshold_bytes = 1;
  repeated string watched_hosts = 2;
  repeated string known_bad_hosts = 3;
  repeated string watched_services = 4;
  repeated string watched_processes = 5;
  repeated string known_bad_services = 6;
  repeated string known_bad_processes = 7;
  // DPI / behavior detectors (optional; defaults applied server-side when unset semantics via false=use defaults is not available in proto3 — always send explicit values from UI).
  bool dpi_exfil_enabled = 10;
  uint64 dpi_exfil_min_bytes = 11;
  double dpi_exfil_ratio = 12;
  bool dpi_idle_enabled = 13;
  uint64 dpi_idle_min_age_secs = 14;
  uint64 dpi_idle_silence_secs = 15;
  uint64 dpi_idle_max_bytes = 16;
  bool dpi_p2p_enabled = 17;
  repeated string dpi_p2p_allow = 18;
}

message GetSyslogConfigRequest {}

message SetSyslogConfigRequest {
  bool enabled = 1;
  string target = 2;
  string proto = 3;
  string facility = 4;
  string tag = 5;
  bool emit_signals = 6;
  bool emit_flows = 7;
  uint64 flow_min_bytes = 8;
  uint64 flow_delta_bytes = 9;
  uint64 flow_interval_secs = 10;
}

message SyslogConfigResponse {
  bool enabled = 1;
  string target = 2;
  string proto = 3;
  string facility = 4;
  string tag = 5;
  bool emit_signals = 6;
  bool emit_flows = 7;
  uint64 flow_min_bytes = 8;
  uint64 flow_delta_bytes = 9;
  uint64 flow_interval_secs = 10;
  uint64 dropped_messages = 11;
  string last_error = 12;
}

message ShutdownCoreRequest {}

message ControlResponse {
  bool accepted = 1;
  string message = 2;
}
